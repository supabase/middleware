name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - name: Check formatting (prettier)
        run: pnpm format:check

      - run: pnpm test

      - run: pnpm build

      - name: Smoke-test built entrypoints load in raw Node
        run: pnpm smoke

      # The floor is TypeScript 5.4 (`NoInfer`), pinned in test/ts-floor. Two
      # checks because there are two published artifacts: JSR ships `src/**/*.ts`
      # and npm ships `dist/*.d.ts`, so neither check covers the other.
      - name: Typecheck source at the minimum supported TypeScript (JSR consumers)
        run: pnpm typecheck:min

      - name: Typecheck a consumer against the published types (npm consumers)
        run: pnpm typecheck:consumer

      - name: Check type exports (attw)
        run: pnpm check-exports

      - name: Verify JSR packaging
        run: pnpm dlx jsr@0.14.3 publish --dry-run --allow-dirty
